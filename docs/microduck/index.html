          eyebrow: "Project · CMU RoboClub · 2026",

          summary: "A 15-DoF biped I built from parts at the CMU RoboClub. It runs Pollen Robotics' policies; mine are the build itself, the reward-audited fine-tuning, the as-built simulation, the sim-to-real measurements and a touch sense the official robot does not have.",
          heroCaption: "2026-10-24, on a table at the CMU RoboClub: Pollen Robotics' walking policy with my IMU heading hold, a left arc, then a stop. Power comes over the USB-C lead from a power bank.",

          standingCaption: "Standing on the floor of the CMU RoboClub, 2026-10-23.",
          whatTitle: "Whose work is which",
          whatBody: `
            <p><strong>Upstream.</strong> The MicroDuck design, the MuJoCo training environment and the walking, standing and ground-pick policies (walk61, stand61, groundpick61) are <a href="https://github.com/pollen-robotics/microduck" target="_blank" rel="noreferrer">Pollen Robotics'</a>. The community part set and the Raspberry Pi runtime this build started from are <a href="https://github.com/AI-FanGe/Microduck-build-tutorial" target="_blank" rel="noreferrer">AI-FanGe's</a>.</p>
            <p><strong>Mine.</strong> The whole-robot build in the four blocks below (34 printed parts of my own, the servo chain and the dual-host controller firmware, the A7Z head with its sensors and the touch board, two power routes); the MuJoCo model of this robot and its acceptance suite; the fine-tuning pipeline with its reward audit and tracking guard; the sim-to-real measurements; the heading hold and the graded hold; and the camera-guided beak pickup, now in training as the 16-831 course project. Everything needed to reproduce the robot is published in <a href="https://github.com/qilinxiaoxiang/cmu-microduck" target="_blank" rel="noreferrer">cmu-microduck</a>.</p>
          `,
          newTitle: "The robot in four blocks",
          newCards: [
            { h: "Form", p: "AI-FanGe's 89-part community set plus 34 parts of my own: a rear converter pack, the A7Z head cap and face, split ankles with slip-fit feet and bicycle-inner-tube soles, a one-piece lower-leg link, a battery backpack. Printed on the club's Bambu X1C and Elegoo Centauri Carbon; every release passes a collision and assembly-path gate before it is sliced." },
            { h: "Actuation", p: "15 ROBOTIS DYNAMIXEL XL330-M288 in one daisy chain on an OpenRB-150 running my dual-host firmware: a Mac drives the bus over USB for bring-up, the head computer drives it alone over a 500 kbaud UART at run time. Hip-yaw and hip-pitch horns refitted to take out play; every joint checked against a stance before torque is enabled." },
            { h: "Intelligence and senses", p: "A Radxa Cubie A7Z (Allwinner A733) in the head runs the 50 Hz control loop, the ONNX policy and the camera. A BNO085 IMU at 50 samples per second over a device-tree overlay I wrote, a MAX98357 amplifier and speaker, the Radxa 13M camera, and five copper touch pads under the cap read by a XIAO ESP32-S3 over I2C, a sense the official design lacks." },

            <p><strong>Measured on the robot, fed back into the simulator.</strong></p>
            <ul>
              <li>IMU pipeline latency about 15 ms; 50 samples per second reach the policy loop while walking.</li>
              <li>4 % of walking ticks miss a fresh servo read; loaded joints ignore corrections under 0.05 rad at gain 200.</li>
              <li>Trunk gyro jitter 4 to 6 times the simulation at 5 to 25 Hz; yaw spikes of 6 to 10 rad/s precede falls.</li>
              <li>The MuJoCo model carries the measured masses and a 7.87° forward gap; its seven-case acceptance suite reads rail voltage, IMU rate and read drops from the robot's state file, so a simulation verdict is tied to the physical robot.</li>
              <li>Reward audit: the first PPO fine-tune learned to stand still while total reward rose 27.6 to 98.8; the per-term audit showed standing already earns 80 % of walking's reward in the stock environment. A launch gate and a tracking guard now stop such runs. The filtered-reward fine-tune walked 17 to 69 % further in simulation and fell at 0.20 m/s on the robot, so the stock policy stays deployed; that gap is the current measurement target.</li>
            </ul>
          `,

            { h: "Stops when you grab its head", p: "All five touch pads work; a head grip during a walk stops the walk and holds the robot." },
            { h: "Quacks", p: "Real duck recordings through the speaker, jaw moving, jaw pressed shut after the quack." },

          goalTitle: "The goal",

            <p>The pickup is the technical stepping stone. Two directions sit behind it.</p>
            <p><strong>A companion robot</strong> that is neither a toy nor a tool: it recognises its owner from other people, keeps a memory of ordinary days and special ones, and gives steady emotional support without speech. The MicroDuck's touch sense, camera and onboard loop are the first pieces of that stack; the rest needs funding and a team.</p>

      const params = new URLSearchParams(window.location.search);
      const forcedLang = params.get("lang");
      const langKey = "site-lang-v3";
      let stored = null;
      try { stored = localStorage.getItem(langKey); } catch (e) { stored = null; }
      let lang = forcedLang === "zh" || forcedLang === "en" ? forcedLang : (stored === "zh" ? "zh" : "en");

      const setText = (id, v) => { document.getElementById(id).textContent = v; };
      const setHTML = (id, v) => { document.getElementById(id).innerHTML = v; };
      const cards = (items) => items.map(c => `<div class="md-card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join("");
      const linkCards = (items, external) => items.map(l => `
        <a class="md-link-card" href="${l.href}"${external ? ' target="_blank" rel="noreferrer"' : ''}>
          <strong>${l.t}</strong>
          <span>${l.d}</span>${l.e ? `<br><em>${l.e}</em>` : ''}
        </a>`).join("");

      function render() {
        const t = content[lang];
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        setHTML("nav-links", t.navLinks.map(l => `<a href="${l.href}">${l.label}</a>`).join(""));
        setText("eyebrow", t.eyebrow);
        setText("title", t.title);
        setText("summary", t.summary);
        setText("hero-caption", t.heroCaption);
        setText("touch-caption", t.touchCaption);
        setText("quack-caption", t.quackCaption);
        setText("standing-caption", t.standingCaption);
        setText("what-title", t.whatTitle);
        setHTML("what-body", t.whatBody);
        setText("new-title", t.newTitle);
        setHTML("new-cards", cards(t.newCards));
        setText("head-caption", t.headCaption);
        setHTML("new-body", t.newBody);
        setText("today-title", t.todayTitle);
        setHTML("today-cards", cards(t.todayCards));
        setHTML("today-limit", t.todayLimit);
        setText("goal-title", t.goalTitle);
        setHTML("goal-intro", t.goalIntro);
        setHTML("goal-steps", t.steps.map((s, i) => `
          <div class="md-step">
            <div class="md-step-n">${i + 1}</div>
            <div><h3>${s.h} <span class="md-badge ${s.c}">${s.s}</span></h3><p>${s.p}</p></div>
          </div>`).join(""));
        setText("course-title", t.courseTitle);
        setHTML("course-body", t.courseBody);
        setText("build-title", t.buildTitle);
        setHTML("build-intro", t.buildIntro);
        setHTML("build-links", linkCards(t.buildLinks, true));
        setText("assembly-caption", t.assemblyCaption);
        setText("walk-caption", t.walkCaption);
        setText("log-title", t.logTitle);
        setHTML("log-intro", t.logIntro);
        setHTML("log-links", linkCards(t.logLinks, true));
        setText("next-title", t.nextTitle);
        setHTML("next-body", t.nextBody);
        setText("credits-title", t.creditsTitle);
        setHTML("credits-body", t.creditsBody);
        setText("back-home", t.backHome);
        document.getElementById("lang-toggle").checked = lang === "zh";
      }

      document.getElementById("lang-toggle").addEventListener("change", (e) => {
        lang = e.target.checked ? "zh" : "en";
        try { localStorage.setItem(langKey, lang); } catch (err) { /* private mode */ }
        render();
      });

      window.addEventListener("scroll", () => {
        document.getElementById("nav").classList.toggle("scrolled", window.scrollY > 50);
      }, { passive: true });

      render();
    </script>
