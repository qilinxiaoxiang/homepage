<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-itunes-app" content="app-id=6832424442">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PocketChords">
<meta property="og:title" content="A song shared with you on PocketChords">
<meta property="og:description" content="Open this link to get the song, with its lyrics and chords, in PocketChords.">
<meta property="og:image" content="https://shawnxiang.com/pocketchords/icon.png">
<meta property="og:url" content="https://shawnxiang.com/pocketchords/s/">
<title>A song on PocketChords</title>
<link rel="canonical" href="https://shawnxiang.com/pocketchords/s/">
<link rel="apple-touch-icon" href="/pocketchords/icon.png">
<style>
  :root {
    --paper: #eff4f2; --sheet: #ffffff; --ink: #15302a; --muted: #566a64;
    --rule: #d8e2de; --chord: #0e7a6b; --chord-deep: #0a5f53;
    --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Hiragino Mincho ProN", "Songti SC", "Noto Serif CJK SC", serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "PingFang SC", "Hiragino Sans", "Noto Sans CJK SC", sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--body); overflow-wrap: anywhere; }
  main { max-width: 480px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--muted); margin: 0 0 32px; }
  .brand img { width: 44px; height: 44px; border-radius: 10px; }

  .wechat { background: #fff4d6; border: 2px solid #e2b23b; border-radius: 12px; padding: 14px 16px; margin: 0 0 24px; font-weight: 600; }

  /* The song title is set the way the app sets a lyric line: a chord sits over the words. */
  .chart { font: 400 clamp(30px, 8.4vw, 38px)/1.2 var(--display); margin: 0 0 10px; }
  .phrase { display: inline-block; max-width: 100%; vertical-align: bottom; }
  .chord {
    display: table; font: 700 14px/1 var(--body); color: #fff; background: var(--chord);
    padding: 5px 8px; border-radius: 7px; margin-bottom: 6px;
    animation: strike .32s ease-out both;
  }
  @keyframes strike { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .chord { animation: none; } }

  .sender { margin: 0 0 24px; color: var(--muted); }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; margin: 0 0 20px; }
  .sheet p { margin: 0 0 12px; }
  .sheet p:last-child { margin-bottom: 0; }
  button, .store {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font: 600 17px/1.2 var(--body); min-height: 50px; padding: 15px 18px; border-radius: 12px;
    border: 1px solid var(--chord); background: var(--chord); color: #fff; cursor: pointer;
  }
  button:hover, .store:hover { background: var(--chord-deep); border-color: var(--chord-deep); }
  :focus-visible { outline: 3px solid #3a86ff; outline-offset: 2px; }
  .sheet .after { margin-top: 14px; }
  .note { font-size: 16px; color: var(--muted); }
  .manual { margin-top: 14px; }
  .manual code { display: block; font-size: 16px; background: var(--paper); border-radius: 8px; padding: 10px; margin: 8px 0 12px; user-select: all; -webkit-user-select: all; }
  footer { margin-top: 28px; font-size: 16px; color: var(--muted); }
  footer a + a { margin-left: 18px; }
  a { color: var(--chord-deep); }
  .store { color: #fff; }
</style>
</head>
<body>
<main>
  <p class="brand"><img src="/pocketchords/icon.png" alt=""><span>PocketChords</span></p>
  <p id="wechat" class="wechat" role="alert" hidden></p>
  <div id="view" aria-live="polite"></div>
  <footer id="footer"></footer>
</main>

<script>
"use strict";
// The anon key is public by design. This page can only call share_landing with it.
const SUPABASE_URL = "https://hesfrabzalbplhhfvsnv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlc2ZyYWJ6YWxicGxoaGZ2c252Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxOTU2OTUsImV4cCI6MjEwOTc3MTY5NX0.DL3zeqv0fPUHFamIk6vPBJedEPkq04mliIMCzoKmKzI";
const APP_STORE_URL = "https://apps.apple.com/us/app/id6832424442";
const LINK_BASE = "https://shawnxiang.com/pocketchords/s/#";

const STRINGS = {
  en: {
    title: "A song on PocketChords",
    sharedBy: (who) => `Shared by ${who}`,
    sharedAnon: "Shared with you",
    get: "Get PocketChords",
    after: "After installing, open the app and choose “Open a shared link” to bring in the song.",
    usStore: "PocketChords is on the US App Store.",
    notCopied: "The link could not be copied. Copy it here, then get the app:",
    gone: "This song is no longer available",
    goneBody: "The link was removed, or it is not a complete link. Ask the person who shared it to send it again.",
    failed: "PocketChords could not be reached",
    failedBody: "Check your connection and reload this page.",
    wechat: "To continue, tap the … menu at the top right and choose Open in Safari.",
    support: "Support", privacy: "Privacy policy",
  },
  zh: {
    title: "PocketChords 上的一首歌",
    sharedBy: (who) => `来自 ${who} 的分享`,
    sharedAnon: "有人分享给你的歌",
    get: "获取 PocketChords",
    after: "安装后，打开应用并选择“打开分享链接”，就能把这首歌导入。",
    usStore: "PocketChords 目前在美区 App Store 上架。",
    notCopied: "链接没能复制。请在这里复制，然后获取应用：",
    gone: "这首歌已无法获取",
    goneBody: "这个链接已被移除，或者链接不完整。请让分享的人重新发送。",
    failed: "无法连接 PocketChords",
    failedBody: "请检查网络后重新加载此页面。",
    wechat: "请点右上角的 … 菜单，选择“在 Safari 中打开”后继续。",
    support: "支持", privacy: "隐私政策",
  },
  ja: {
    title: "PocketChords の曲",
    sharedBy: (who) => `${who} さんからの共有`,
    sharedAnon: "あなたに共有された曲",
    get: "PocketChords を入手",
    after: "インストール後、アプリを開いて「共有リンクを開く」を選ぶと、この曲を取り込めます。",
    usStore: "PocketChords は米国の App Store で公開しています。",
    notCopied: "リンクをコピーできませんでした。ここからコピーしてアプリを入手してください：",
    gone: "この曲は利用できなくなりました",
    goneBody: "リンクが削除されたか、不完全です。共有した人にもう一度送ってもらってください。",
    failed: "PocketChords に接続できません",
    failedBody: "ネットワークを確認してこのページを再読み込みしてください。",
    wechat: "続けるには、右上の … メニューから「Safari で開く」を選んでください。",
    support: "サポート", privacy: "プライバシーポリシー",
  },
};

const LANG = (() => {
  for (const tag of navigator.languages || [navigator.language || "en"]) {
    const base = tag.toLowerCase().split("-")[0];
    if (STRINGS[base]) return base;
  }
  return "en";
})();
const T = STRINGS[LANG];
document.documentElement.lang = LANG === "zh" ? "zh-Hans" : LANG;
document.title = T.title;

const view = document.getElementById("view");

// Builds elements with textContent only: song and sender names come from strangers.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  el.append(...kids.filter(Boolean));
  return el;
}

function chart(words) {
  return h("h1", { class: "chart" },
    h("span", { class: "phrase" },
      h("span", { class: "chord", "aria-hidden": "true", text: "C" }),
      h("span", { text: words })));
}

function message(title, body) {
  view.replaceChildren(chart(title), h("p", { class: "sender", text: body }));
}

async function copyLink(link) {
  try {
    await navigator.clipboard.writeText(link);
    return true;
  } catch {
    const box = h("textarea", { style: "position:fixed;top:0;left:0;opacity:0;font-size:16px", readonly: "" });
    box.value = link;
    document.body.append(box);
    box.select();
    box.setSelectionRange(0, link.length);
    let done = false;
    try { done = document.execCommand("copy"); } catch { done = false; }
    box.remove();
    return done;
  }
}

function renderSong(row, token) {
  const link = LINK_BASE + token;
  const manual = h("div");
  const get = h("button", { type: "button", text: T.get });
  get.addEventListener("click", async () => {
    if (await copyLink(link)) {
      location.href = APP_STORE_URL;
      return;
    }
    manual.replaceChildren(h("div", { class: "manual" },
      h("p", { class: "note", text: T.notCopied }),
      h("code", { text: link }),
      h("a", { class: "store", href: APP_STORE_URL, text: T.get })));
  });
  view.replaceChildren(
    chart(row.name),
    h("p", { class: "sender", text: row.sender_name ? T.sharedBy(row.sender_name) : T.sharedAnon }),
    h("section", { class: "sheet" }, get, manual, h("p", { class: "after", text: T.after })),
    h("p", { class: "note", text: T.usStore }),
  );
}

async function load() {
  const token = location.hash.slice(1);
  if (!/^[A-Za-z0-9_-]{16,128}$/.test(token)) {
    message(T.gone, T.goneBody);
    return;
  }
  let response;
  try {
    response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/share_landing`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ p_token: token }),
    });
  } catch {
    message(T.failed, T.failedBody);
    return;
  }
  if (!response.ok) {
    message(T.failed, T.failedBody);
    return;
  }
  const rows = await response.json();
  if (!Array.isArray(rows) || rows.length === 0) {
    message(T.gone, T.goneBody);
    return;
  }
  renderSong(rows[0], token);
}

if (/MicroMessenger/i.test(navigator.userAgent)) {
  const banner = document.getElementById("wechat");
  banner.textContent = T.wechat;
  banner.hidden = false;
}
document.getElementById("footer").append(
  h("a", { href: "/pocketchords/", text: T.support }),
  h("a", { href: "/pocketchords/privacy.html", text: T.privacy }),
);
window.addEventListener("hashchange", load);
load();
</script>
</body>
</html>
