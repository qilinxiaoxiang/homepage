  .chord {
    display: table; font: 700 14px/1 var(--body); color: #fff; background: var(--chord);
    padding: 5px 8px; border-radius: 7px; margin-bottom: 6px;
    animation: strike .32s ease-out both; animation-delay: calc(var(--i) * 110ms);
  }
  @keyframes strike { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .chord { animation: none; } }

  .lead { margin: 0 0 24px; }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 16px; padding: 4px 20px; margin: 0 0 20px; }
  .group { padding: 16px 0; }
  .group + .group { border-top: 1px solid var(--rule); }
  .group h2 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .group li { position: relative; padding-left: 26px; margin: 5px 0; }
  .group li::before { position: absolute; left: 2px; font-weight: 700; }
  .can li::before { content: "\2713"; color: var(--chord); }
  .cannot li::before { content: "\2715"; color: var(--stop); }
  .note { font-size: 16px; color: var(--muted); margin: 0 0 12px; }

  .actions { display: flex; gap: 12px; margin: 24px 0 8px; }
  .actions button { flex: 1; }
  button, .signin-apple {
    font: 600 17px/1.2 var(--body); min-height: 50px; padding: 12px 18px; border-radius: 12px;
    border: 1px solid var(--ink); background: var(--sheet); color: var(--ink); cursor: pointer;

  button.primary { background: var(--chord); border-color: var(--chord); color: #fff; }
  button.primary:hover { background: var(--chord-deep); border-color: var(--chord-deep); }
  button.stop { background: var(--stop); border-color: var(--stop); color: #fff; }
  button.plain { background: none; border: 0; padding: 0; min-height: 44px; font-weight: 400; color: var(--chord-deep); text-decoration: underline; font-size: 16px; }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 3px solid #3a86ff; outline-offset: 2px; }

  .signin { display: grid; gap: 12px; margin: 0 0 20px; }
  .signin-apple { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: #000; border-color: #000; color: #fff; }

  .app-row h2 { font-size: 18px; font-weight: 600; margin: 0; }

  .app-row .actions { margin: 8px 0 0; }

  footer { margin-top: 28px; font-size: 16px; color: var(--muted); }

  a { color: var(--chord-deep); }
  @media (max-width: 420px) { .actions { flex-direction: column-reverse; } .app-row .actions { flex-direction: row; } }

// Builds elements with textContent only: client names come from strangers.
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v);
  }
  el.append(...kids.filter(Boolean));
  return el;
}

function chart(parts) {
  return h("h1", { class: "chart" }, ...parts.map(([chord, words], i) =>
    h("span", { class: "phrase" },
      h("span", { class: "chord", style: `--i:${i}`, "aria-hidden": "true", text: chord }),
      h("span", { text: words }))));
}

function show(...nodes) {
  view.replaceChildren(...nodes.filter(Boolean));
}
function alertBox(message) {
  return h("p", { class: "alert", role: "alert", text: message });
}
function setFooter(session) {
  const nodes = [];
  if (session) {
    nodes.push(h("p", { text: T.signedIn(session.user.email || session.user.id) }));
    nodes.push(h("p", {}, h("button", { class: "plain", type: "button", on: { click: signOut }, text: T.switchAccount })));
  }
  nodes.push(h("p", {},
    authorizationId ? h("a", { href: "/pocketchords/connect/", text: T.manage }) : null,
    authorizationId ? document.createTextNode("   ") : null,
    h("a", { href: PRIVACY_URL, text: T.privacy })));
  footer.replaceChildren(...nodes);
}

async function signOut() {
  await client.auth.signOut({ scope: "local" });
  route();
}

function safeRedirect(url) {
  try {
    const protocol = new URL(url).protocol;
    return !["javascript:", "data:", "vbscript:", "file:", "about:", "blob:"].includes(protocol);
  } catch {
    return false;
  }
}
function hostOf(url) {
  try {
    const u = new URL(url);
    return u.host || u.protocol;
  } catch {
    return url;
  }
}

function leave(url, title) {
  if (!safeRedirect(url)) {
    show(alertBox(T.unsafe));
    return;
  }
  show(chart(title), h("p", { class: "lead", text: T.leaving }));
  location.assign(url);
}

// ---------- sign-in ----------
// The provider signs a hash of the nonce into its ID token; Supabase is given the original and compares.
async function newNonce() {
  const bytes = crypto.getRandomValues(new Uint8Array(32));
  const raw = btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw)));
  return { raw, hashed: Array.from(digest, (b) => b.toString(16).padStart(2, "0")).join("") };
}

function whenReady(check, timeoutMs = 6000) {
  return new Promise((resolve) => {
    const started = Date.now();
    const tick = () => {
      if (check()) resolve(true);
      else if (Date.now() - started > timeoutMs) resolve(false);
      else setTimeout(tick, 100);
    };
    tick();
  });
}

async function finishSignIn(provider, token, nonce) {
  const { error } = await client.auth.signInWithIdToken({ provider, token, nonce });
  if (error) {
    console.error("sign-in refused", error.code || error.status);
    renderSignIn(T.signinFailed);
    return;
  }
  route();
}

async function renderSignIn(message) {
  setFooter(null);
  const appleButton = h("button", { class: "signin-apple", type: "button" });
  appleButton.innerHTML = '<svg viewBox="0 0 17 20" aria-hidden="true"><path d="M14.1 10.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.9-.8-3.1-.8C4.5 5.4 3 6.300 2.200 7.700c-1.700 2.900-.4 7.200 1.200 9.500.8 1.100 1.700 2.400 3 2.400 1.200 0 1.700-.8 3.100-.8 1.500 0 1.900.8 3.100.8 1.300 0 2.100-1.100 2.900-2.300.9-1.300 1.300-2.600 1.300-2.700-.1 0-2.700-1-2.700-4zM11.800 3.600c.7-.8 1.100-2 1-3.200-1 0-2.200.7-2.900 1.500-.6.700-1.200 1.900-1 3 1.100.1 2.200-.6 2.900-1.300z"/></svg>';
  appleButton.append(T.apple);
  const googleSlot = h("div", { id: "google-button" });
  const notice = h("div");
  if (message) notice.append(alertBox(message));
  show(chart(T.signinTitle), h("p", { class: "lead", text: T.signinLead }), notice, h("div", { class: "signin" }, appleButton, googleSlot));

  const [appleNonce, googleNonce] = await Promise.all([newNonce(), newNonce()]);
  const appleState = appleNonce.raw.slice(0, 20);

  appleButton.addEventListener("click", async () => {
    if (!(await whenReady(() => window.AppleID && window.AppleID.auth))) {
      notice.replaceChildren(alertBox(T.providerMissing));
      return;
    }
    try {
      window.AppleID.auth.init({ clientId: APPLE_SERVICES_ID, scope: "name email", redirectURI: APPLE_RETURN_URL, state: appleState, nonce: appleNonce.hashed, usePopup: true });
      const answer = await window.AppleID.auth.signIn();
      if (answer.authorization.state !== appleState) throw new Error("state mismatch");
      await finishSignIn("apple", answer.authorization.id_token, appleNonce.raw);
    } catch (e) {
      if (e && e.error === "popup_closed_by_user") return;
      console.error("apple sign-in failed", (e && e.error) || (e && e.message));
      notice.replaceChildren(alertBox(T.signinFailed));
    }
  });

  if (await whenReady(() => window.google && window.google.accounts && window.google.accounts.id)) {
    window.google.accounts.id.initialize({
      client_id: GOOGLE_WEB_CLIENT_ID,
      nonce: googleNonce.hashed,
      ux_mode: "popup",
      auto_select: false,
      callback: (response) => finishSignIn("google", response.credential, googleNonce.raw),
    });
    window.google.accounts.id.renderButton(googleSlot, {
      type: "standard", theme: "outline", size: "large", text: "signin_with",
      width: Math.min(googleSlot.clientWidth || 320, 400),
      locale: LANG === "zh" ? "zh_CN" : LANG,
    });
  } else {
    googleSlot.replaceWith(alertBox(T.providerMissing));
  }
}

// ---------- consent ----------
function sessionEnded(error) {
  return error && (error.status === 401 || error.code === "session_not_found" || error.code === "bad_jwt");
}

async function renderConsent(session) {
  const { data, error } = await client.auth.oauth.getAuthorizationDetails(authorizationId);
  if (sessionEnded(error)) {
    await client.auth.signOut({ scope: "local" });
    return renderSignIn();
  }
  if (error || !data) {
    show(alertBox(error && error.status && error.status < 500 ? T.expired : T.loadFailed));
    return;
  }
  // No authorization_id in the answer means this person already agreed and a code is ready.
  if (!data.authorization_id) {
    leave(data.redirect_url, T.allowedTitle((data.client && data.client.name) || "App"));
    return;
  }

  const name = (data.client && data.client.name) || "App";
  const notice = h("div");
  const allow = h("button", { class: "primary", type: "button", text: T.allow });
  const deny = h("button", { type: "button", text: T.deny });

  async function answer(method, title) {
    allow.disabled = deny.disabled = true;
    notice.replaceChildren();
    const { data: result, error: failed } = await client.auth.oauth[method](authorizationId, { skipBrowserRedirect: true });
    if (failed || !result || !result.redirect_url) {
      console.error("consent failed", failed && (failed.code || failed.status));
      notice.replaceChildren(alertBox(failed && failed.status && failed.status < 500 ? T.expired : T.actionFailed));
      allow.disabled = deny.disabled = false;
      return;
    }
    leave(result.redirect_url, title);
  }
  allow.addEventListener("click", () => answer("approveAuthorization", T.allowedTitle(name)));
  deny.addEventListener("click", () => answer("denyAuthorization", T.deniedTitle));

  show(
    chart(T.consentTitle(name)),
    notice,
    h("section", { class: "sheet" },
      h("div", { class: "group can" }, h("h2", { text: T.canHead }), h("ul", {}, ...T.can.map((t) => h("li", { text: t })))),
      h("div", { class: "group cannot" }, h("h2", { text: T.cannotHead }), h("ul", {}, ...T.cannot.map((t) => h("li", { text: t }))))),
    h("p", { class: "note", text: T.named }),
    data.redirect_uri ? h("p", { class: "note", text: T.returnTo(hostOf(data.redirect_uri)) }) : null,
    h("p", { class: "note", text: T.policy }),
    h("div", { class: "actions" }, deny, allow),
  );
  setFooter(session);
}

// ---------- connected apps ----------
async function renderApps(session) {
  setFooter(session);
  const { data, error } = await client.auth.oauth.listGrants();
  if (sessionEnded(error)) {
    await client.auth.signOut({ scope: "local" });
    return renderSignIn();
  }
  if (error) {
    show(chart(T.appsTitle), alertBox(T.loadFailed));
    return;
  }
  if (!data.length) {
    show(chart(T.appsTitle), h("p", { class: "lead", text: T.none }));
    return;
  }
  const dates = new Intl.DateTimeFormat(LANG, { dateStyle: "long" });
  const rows = data.map((grant) => {
    const name = grant.client.name || grant.client.id;
    const row = h("div", { class: "app-row" });
    const showIdle = () => {
      row.replaceChildren(
        h("h2", { text: name }),
        h("p", { text: T.since(dates.format(new Date(grant.granted_at))) }),
        h("div", { class: "actions" }, h("button", { type: "button", on: { click: showConfirm }, text: T.disconnect })),
      );
    };
    const showConfirm = () => {
      const notice = h("div");
      const yes = h("button", { class: "stop", type: "button", text: T.disconnect });
      yes.addEventListener("click", async () => {
        yes.disabled = true;
        const { error: failed } = await client.auth.oauth.revokeGrant({ clientId: grant.client.id });
        if (failed) {
          console.error("revoke failed", failed.code || failed.status);
          notice.replaceChildren(alertBox(T.actionFailed));
          yes.disabled = false;
          return;
        }
        renderApps(session);
      });
      row.replaceChildren(
        h("h2", { text: name }),
        h("p", { text: T.disconnectAsk(name) }),
        notice,
        h("div", { class: "actions" }, h("button", { type: "button", on: { click: showIdle }, text: T.keep }), yes),
      );
    };
    showIdle();
    return row;
  });
  show(chart(T.appsTitle), h("p", { class: "lead", text: T.appsLead }), h("section", { class: "sheet" }, ...rows));
}

async function route() {
  const { data: { session } } = await client.auth.getSession();
  if (!session) return renderSignIn();
  if (authorizationId) return renderConsent(session);
  return renderApps(session);
}

route().catch((e) => {
  console.error("page failed", e && e.message);
  show(alertBox(T.loadFailed));
});
</script>
</body>
</html>
